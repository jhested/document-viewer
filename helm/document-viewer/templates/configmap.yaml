apiVersion: v1
kind: ConfigMap
metadata: { name: {{ .Release.Name }}-config }
data:
  JWT_ALGORITHM: {{ .Values.config.jwtAlgorithm | quote }}
  JWT_REQUIRED_ISS: {{ .Values.config.jwtRequiredIss | quote }}
  SOURCE_BACKEND: {{ .Values.config.sourceBackend | quote }}
  S3_ENDPOINT: {{ .Values.config.s3Endpoint | quote }}
  S3_BUCKET: {{ .Values.config.s3Bucket | quote }}
  S3_REGION: {{ .Values.config.s3Region | quote }}
  CACHE_TTL_SECONDS: {{ .Values.config.cacheTtlSeconds | quote }}
  MAX_SOURCE_BYTES: {{ .Values.config.maxSourceBytes | quote }}
  MAX_PAGES: {{ .Values.config.maxPages | quote }}
  MAX_PAGE_WIDTH: {{ .Values.config.maxPageWidth | quote }}
  RENDER_TIMEOUT_SECONDS: {{ .Values.config.renderTimeoutSeconds | quote }}
  OFFICE_TIMEOUT_SECONDS: {{ .Values.config.officeTimeoutSeconds | quote }}
  FS_ROOT: {{ .Values.config.fsRoot | quote }}
  WATERMARK_OPACITY: {{ .Values.config.watermarkOpacity | quote }}
  WATERMARK_FONT_SIZE: {{ .Values.config.watermarkFontSize | quote }}
  WATERMARK_ANGLE: {{ .Values.config.watermarkAngle | quote }}
  WATERMARK_COLOR: {{ .Values.config.watermarkColor | quote }}
  RATE_LIMIT_PER_JTI: {{ .Values.config.rateLimitPerJti | quote }}
  RATE_LIMIT_WINDOW_SECONDS: {{ .Values.config.rateLimitWindowSeconds | quote }}
