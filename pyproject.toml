[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "document-viewer"
version = "0.1.0"
description = "Safe, watermarking document renderer for KYC/AML workflows"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Jimmi Hested" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Multimedia :: Graphics :: Viewers",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "arq>=0.26",
    "redis>=5.2",
    "httpx>=0.28",
    "aioboto3>=13.2",
    "pyjwt[crypto]>=2.10",
    "pypdfium2>=4.30",
    "pikepdf>=9.4",
    "Pillow>=11.0",
    "pillow-heif>=0.18",
    "python-magic>=0.4.27",
    "structlog>=24.4",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-httpx>=0.34",
    "moto[s3]>=5.0",
    "freezegun>=1.5",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-redis",
    "types-Pillow",
    "fakeredis>=2.26",
]

[project.scripts]
viewer-api = "document_viewer.api.app:main"
viewer-worker = "document_viewer.worker.settings:main"

[tool.hatch.build.targets.wheel]
packages = ["src/document_viewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]
markers = [
    "integration: end-to-end tests that need compose.test.yaml services",
]
addopts = "-m 'not integration'"

[tool.coverage.run]
source = ["src/document_viewer"]
branch = true
